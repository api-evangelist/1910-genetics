name: 1910 Genetics
description: '1910 Genetics (now branded 1910) is an AI-native biotechnology company advancing small
  and large molecule drug discovery with a multimodal AI platform powered by high-throughput laboratory
  automation. Its ITO platform integrates computational data, wet-lab proxy biological data, and wet-lab
  ground-truth biological data to pursue "modality agnostic" drug discovery, alongside named AI models
  including PEGASUS (macrocyclic peptide discovery) and CANDID-CNS (CNS-penetration prediction). The
  company partners with pharma and technology organizations and offers co-engineering collaborations at
  the data, AI-model, compute, and interactive-tool levels. It is tracked in the API Evangelist network
  as a portfolio company of Playground Global. As of this profile the company publishes no public API,
  SDK, or developer documentation surface.'
